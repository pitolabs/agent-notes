# Actions are pinned by commit SHA (Renovate keeps the SHA and the version comment current) and Bun by version; the
# lockfile pins the rest. The token is read-only.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (no version given: reads "packageManager": "bun@x.y.z")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run format:check # biome ci: formatting, lint and imports, never writes
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Only src/mastra pulls a framework.
      - run: "! grep -rn '@mastra' dist/core dist/mcp dist/cli"
      # The reference image builds and its CLI starts.
      - run: docker build -t agent-notes:ci .
      - run: docker run --rm agent-notes:ci --help

  # What a consumer imports, on every Node major the package supports: the oldest version engines allows (>=22.13.0),
  # the current LTS and the newest. Bun runs the tests; this proves the built entry points load and the CLI runs under
  # Node.
  node:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (no version given: reads "packageManager": "bun@x.y.z")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --input-type=module -e "import('./dist/core/index.js').then(m => { if (typeof m.LibSQLNotesIndex !== 'function') process.exit(1) })"
      - run: node --input-type=module -e "import('./dist/mastra/index.js').then(m => { if (typeof m.notesTools !== 'function') process.exit(1) })"
      - run: node dist/cli/main.js --help

  # The mise-pinned checks every repository runs (base-repo-standard). `cache: false`: mise checks each download
  # against mise.lock, but a restored tool cache would be trusted as-is.
  base:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false # tools are verified against mise.lock on every download; a restored cache is not
      - run: mise run check:secrets
      - run: mise run check:workflows
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (known-vulnerable-actions, stale refs)
      - run: mise run check:shell
      - run: mise run check:vulns

  # A backstop, not prevention: when it runs, the commits are already public. It catches what a machine without the
  # hooks pushed, and new rules applied to old history. privacy-scan.sh runs the gitleaks pinned in mise.toml.
  privacy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the last one
          persist-credentials: false
          # A pull request's own commits, not the test merge GitHub makes for it: that one is authored with the
          # opener's GitHub e-mail setting and never reaches main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false # tools are verified against mise.lock on every download; a restored cache is not
      - run: sh scripts/privacy-scan.sh --history
        env:
          # Repository secret: the blocklist's text (gh secret set PRIVACY_BLOCKLIST < ~/.config/privacy/blocklist.txt).
          PRIVACY_BLOCKLIST_TEXT: ${{ secrets.PRIVACY_BLOCKLIST }}
          # A pull request from a fork gets no secrets: scan it with gitleaks and the identity check only.
          PRIVACY_BLOCKLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork || false }}
